name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Determine release state
        id: state
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$(npm view "$(node -p "require('./package.json').name")@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        if: steps.state.outputs.tag_exists == 'false' || steps.state.outputs.published == 'false'
        run: bun install --frozen-lockfile

      - name: Verify (lint, typecheck, tests, bun smoke)
        if: steps.state.outputs.tag_exists == 'false' || steps.state.outputs.published == 'false'
        run: bun run ci:test

      - name: Create tag
        if: steps.state.outputs.tag_exists == 'false'
        run: |
          git tag "v${{ steps.state.outputs.version }}"
          git push origin "v${{ steps.state.outputs.version }}"

      - name: Create GitHub release
        if: steps.state.outputs.release_exists == 'false'
        run: |
          gh release create "v${{ steps.state.outputs.version }}" \
            --title "v${{ steps.state.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to npm (OIDC trusted publishing)
        if: steps.state.outputs.published == 'false'
        run: npm publish --ignore-scripts

      - name: Summary
        run: |
          {
            echo "## Release v${{ steps.state.outputs.version }}"
            echo "- tag: ${{ steps.state.outputs.tag_exists == 'true' && 'already existed' || 'created' }}"
            echo "- GitHub release: ${{ steps.state.outputs.release_exists == 'true' && 'already existed' || 'created' }}"
            echo "- npm: ${{ steps.state.outputs.published == 'true' && 'already published' || 'published' }}"
          } >> "$GITHUB_STEP_SUMMARY"
